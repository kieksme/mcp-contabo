name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch publish.yml after a release (OIDC requires the publish workflow, not workflow_call)

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['contabo-mcp--release_created'] == 'true' || steps.release.outputs.releases_created == 'true' }}
      tag_name: ${{ steps.release.outputs['contabo-mcp--tag_name'] }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # npm Trusted Publishing validates the workflow that *runs* publish (OIDC `workflow` claim).
  # workflow_call would attribute the run to release-please.yml and fail with 404 on npm.
  # Dispatch publish.yml so OIDC matches the trusted publisher (see CONTRIBUTING.md).
  trigger-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Release (publish.yml)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh workflow run publish.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f "tag=${TAG}"
          echo "Dispatched publish.yml for tag ${TAG}"

  # Same rationale as trigger-publish: a GITHUB_TOKEN-pushed tag does not fire
  # push-triggered workflows, so dispatch the GHCR build explicitly.
  trigger-docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Docker Publish (docker-publish.yml)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh workflow run docker-publish.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f "tag=${TAG}"
          echo "Dispatched docker-publish.yml for tag ${TAG}"
