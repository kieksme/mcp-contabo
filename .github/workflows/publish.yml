name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_call:
    inputs:
      tag:
        description: Semver tag to publish (e.g. 1.0.3)
        required: true
        type: string
  workflow_dispatch:

defaults:
  run:
    working-directory: contabo-mcp

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: contabo-mcp/pnpm-lock.yaml

      - name: Verify tag matches package version
        if: github.event_name != 'workflow_dispatch'
        working-directory: .
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          PKG=$(node -p "require('./contabo-mcp/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match contabo-mcp/package.json version $PKG"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Verify npm pack contents
        run: pnpm run pack:check

  publish-npm:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: contabo-mcp/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Publish to npm (trusted publishing)
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npx --yes npm@11.5.1 publish --access public --provenance

  # Release Please creates the GitHub Release when a release PR merges.
  # This job runs only for manual tag pushes (fallback).
  github-release:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve release version
        id: version
        working-directory: .
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(node -p "require('./contabo-mcp/package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes from CHANGELOG
        working-directory: .
        run: node scripts/changelog-release-notes.mjs "${{ steps.version.outputs.value }}" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: ${{ steps.version.outputs.value }}
          body_path: release-notes.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
