# npm Trusted Publishing on npmjs.com must list this workflow file: publish.yml
# (not publish-npm.yml). release-please.yml calls this via workflow_call.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Semver tag to publish (e.g. 1.2.0)
        required: true
        type: string
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Semver tag to publish (e.g. 1.1.2)
        required: true
        type: string

defaults:
  run:
    working-directory: contabo-mcp

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag || github.event.inputs.tag || github.ref_name) }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: contabo-mcp/pnpm-lock.yaml

      - name: Verify tag matches package version
        working-directory: .
        run: |
          TAG="${{ inputs.tag || github.event.inputs.tag || github.ref_name }}"
          PKG=$(node -p "require('./contabo-mcp/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match contabo-mcp/package.json version $PKG"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Verify npm pack contents
        run: pnpm run pack:check

      - name: MCP build smoke (version + tool registration)
        run: node -e "import('./dist/version.js').then(m => { const v = m.loadPackageVersion(); if (!/^\\d+\\.\\d+\\.\\d+/.test(v)) process.exit(1); console.log('version', v); })"

  publish-npm:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag || github.event.inputs.tag || github.ref_name) }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: contabo-mcp/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Publish to npm (trusted publishing)
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: npx --yes npm@11.5.1 publish --access public --provenance
