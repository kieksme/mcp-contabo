name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contabo-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contabo-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Verify npm pack contents
        run: pnpm run pack:check

      - name: MCP build smoke (version + tool registration)
        run: node -e "import('./dist/version.js').then(m => { const v = m.loadPackageVersion(); if (!/^\\d+\\.\\d+\\.\\d+/.test(v)) process.exit(1); console.log('version', v); })"

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # contabo-mcp must be built first — the dashboard embeds it in-process
      # (imports @kieksme/contabo-mcp/server, which resolves to its dist/ output).
      - name: Build contabo-mcp
        working-directory: contabo-mcp
        run: pnpm run build

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test
