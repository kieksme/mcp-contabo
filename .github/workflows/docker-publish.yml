# Builds and publishes the Docker image to the GitHub Container Registry (GHCR).
# Hooked into the existing release-please flow: release-please.yml dispatches this
# with the release tag (a GITHUB_TOKEN-pushed tag does not trigger `push` events).
# Also fires on manual version-tag pushes and via workflow_dispatch.
name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Semver tag to build (e.g. 1.4.0)
        required: true
        type: string
  push:
    tags:
      - "*.*.*"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/contabo-mcp

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve tag
        id: tag
        run: echo "value=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.value }}

      - name: Verify tag matches package version
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          PKG=$(node -p "require('./contabo-mcp/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match contabo-mcp/package.json version $PKG"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # `latest=auto` (default) tags the newest stable semver as :latest.
          # Releases only come from main, so :latest tracks the latest main release.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.value }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: contabo-mcp
          file: contabo-mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
